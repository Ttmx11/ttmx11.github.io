title: "Sicen Guo | 郭思岑"
name: "Sicen Guo"
description: "Sicen Guo, Ph.D. student at Tongji University. Computer vision, vision foundation models, multimodal reasoning and segmentation."
url: "https://ttmx11.github.io"
baseurl: ""
repository: "Ttmx11/ttmx11.github.io"
locale: "en-US"
site_theme: "default"
timezone: "Asia/Shanghai"
encoding: "utf-8"
markdown: kramdown
kramdown:
  input: GFM
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-sitemap
defaults:
  - scope:
      path: ""
    values:
      layout: academic
      lang: en
exclude:
  - README.md
  - MAINTENANCE.md
  - SOURCES.md
  - THIRD_PARTY_NOTICES.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - tools
  - scripts
  - output
  - tmp
  - vendor
