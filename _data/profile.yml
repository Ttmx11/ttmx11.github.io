    我是**郭思岑**，现为**同济大学**控制科学与工程专业的直博研究生，导师为
    [范睿教授](https://www.ruirangerfan.com/)，所在实验室为
    [机器智能与自主系统（MIAS）实验室](https://mias.group/)。
    我于 2022 年获得同济大学学士学位。
  research_intro: >-
    我的研究聚焦于计算机视觉与智能场景理解，探索视觉基础模型、多模态大语言模型
    与几何信息如何支持具有泛化能力的感知和推理，并应用于自动驾驶场景。
  interests:
    - 视觉基础模型
    - 多模态推理与分割
    - 开放词汇分割
    - 强化学习
    - 知识蒸馏
