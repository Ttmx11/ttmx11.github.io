      institution: Tongji University
      period: "Sep. 2022 – Present"
      detail: Direct-entry doctoral program
    - degree: Bachelor's degree in Control Science and Engineering
      institution: Tongji University
      period: "Sep. 2018 – Sep. 2022"
      detail: College of Electronics and Information Engineering
zh:
