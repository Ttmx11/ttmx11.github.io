en:
  role: Ph.D. Student
  university: Tongji University
  department: College of Electronics and Information Engineering
  location: Shanghai, China
  lab: MIAS Group
  intro: >-
    I am **Sicen Guo (郭思岑)**, a Ph.D. student in Control Science and Engineering at **Tongji University**,
    advised by [Prof. Rui Fan](https://www.ruirangerfan.com/) in the
    [Machine Intelligence & Autonomous Systems (MIAS) Group](https://mias.group/).
    I received my bachelor's degree from Tongji University in 2022.
  research_intro: >-
    My research focuses on computer vision and intelligent scene understanding.
    I study how vision foundation models, multimodal large language models,
    and geometric information can support generalizable perception and reasoning,
    with applications to autonomous driving.
  interests:
    - Vision foundation models
    - Multimodal reasoning & segmentation
    - Open-vocabulary segmentation
    - Reinforcement learning
    - Knowledge distillation
  education:
